<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width initial scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Dashboard view</title>
    </head>
    <body>
        <header>
            <h1>GreenLedger</h1>
        </header>
        <hr>
        <div class="alpha">
            <p>Gracefield Schools</p>
            <h2>Good Morning</h2>
           <div class="carder">
              <div class="cardie-1">
                 <p>Collected Today</p>
                 <h2>#120,000</h2>
                </div>
                <div class="cardie-2">
                     <p>Still Owing</p>
                     <h3>#1,600,000</h3>
                </div>
                <div class="cardie-3">
                 <p>paid 68%</p>
                 <h2>68% completed</h2>
                </div>
            </div>
            <div class="search-area">
              <input type="search" placeholder="Search Students">
            </div>
            <nav>
                <div class="nav-sec">
                 <a href="" class="link">All</a>
                 <a href="" class="link">JSS1</a>
                 <a href="" class="link">JSS2</a>
                 <a href="" class="link">JSS3</a>
                 <a href="" class="link">SSS1</a>
                 <a href="" class="link">SSS2</a>
                 <a href="" class="link">SSS3</a>
                 <a href="" class="link">Overdue</a>
                </div> 
            </nav>
           <h3>Action Needed Today</h3>
           <div class="info">
             <h2>Record a Payment</h2>
             <label for="student-name">Student Name</label>
             <input type="text" placeholder="Amal Rodiah" required>
             <label for="amount">Amount</label>
             <input type="number" placeholder="#20,000" required>
             <button type="submit" class="btns">Submit Payment</button>
           </div>

        </div>
    </body>
</html>
