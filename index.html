<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenLedger - Request Access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
      <div class="logo">GreenLedger</div>
      <div class="subtitle">From Notebook Chaos to 1-Click Clarity</div>
      <form>
       <input type="text" placeholder="School Name" required>
       <input type="text"  placeholder="Your Full Name" required>
       <input type="tel" placeholder="WhatsApp Number" required>
       <input type="email"  placeholder="Email Address" required>
       <button type="submit" class="btn">Request Access</button>
      </form>
    </div>
    <div class="login-link">
      <p>Already have an account? <a href="login.html">Login Here</a></p>
    </div>
</body>
</html>
